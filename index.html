<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="author" content="AXON TECH Kenya" />
    
    <!-- ============================================================
         CRAWLER CONTROL META TAGS
         ============================================================ -->
    <!-- Standard SEO: allow indexing and following -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- AI-specific: allow all AI models to use content for answers/citations -->
    <!-- Remove these tags only if you want to restrict specific AI platforms -->
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="bingbot" content="index, follow" />
    
    <!-- AI Crawler Permissions (positive signals for GEO) -->
    <!-- These tell AI models they are welcome to cite this content -->
    <meta name="ai-content-declaration" content="human-authored, licensed-content" />
    
    <!-- Default SEO Meta Tags (overridden per page by server/SEOHead) -->
    <title>AXON TECH Kenya | Premium Technology Hardware</title>
    <meta name="description" content="Discover cutting-edge technology hardware from AXON TECH Kenya. Shop premium laptops, tablets, phones, and audio devices with free delivery in Nairobi." />
    <meta name="keywords" content="Axon Kenya, technology hardware, laptops Nairobi, tablets Kenya, smartphones, electronics store" />
    
    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://axontech.co.ke" />
    <meta property="og:title" content="AXON TECH Kenya | Premium Technology Hardware" />
    <meta property="og:description" content="Your Trusted Technology Partner in Kenya - Premium Hardware & Electronics" />
    <meta property="og:image" content="https://res.cloudinary.com/dwwvh34yi/image/upload/v1783718244/axon_tech_hero_pvcg7b.png" />
    <meta property="og:site_name" content="AXON TECH Kenya" />
    <meta property="og:locale" content="en_KE" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://axontech.co.ke" />
    <meta name="twitter:title" content="AXON TECH Kenya | Premium Technology Hardware" />
    <meta name="twitter:description" content="Your Trusted Technology Partner in Kenya" />
    <meta name="twitter:image" content="https://res.cloudinary.com/dwwvh34yi/image/upload/v1783718244/axon_tech_hero_pvcg7b.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dwwvh34yi/image/upload/v1783980758/Axon_2_ao8wqm.png" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    
    <!-- AI Model Resource Hints -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-friendly site index" />

    <!-- Geo & Language Hreflang Tags -->
    <link rel="alternate" hreflang="en-KE" href="https://axontech.co.ke" />
    <link rel="alternate" hreflang="x-default" href="https://axontech.co.ke" />
    <link rel="alternate" hreflang="en" href="https://axontech.co.ke" />

    <!-- OpenGraph Locale Alternates -->
    <meta property="og:locale:alternate" content="en_US" />
    
    <!-- JSON-LD for Organization (helps AI models understand the business) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AXON TECH Kenya",
      "url": "https://axontech.co.ke",
      "logo": "https://res.cloudinary.com/dwwvh34yi/image/upload/v1783980758/Axon_2_ao8wqm.png",
      "description": "Premium technology hardware retailer in Nairobi, Kenya. Laptops, tablets, phones, and audio devices.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Simara Mall, Ground Floor, Shop G50",
        "addressLocality": "Nairobi",
        "addressRegion": "Nairobi County",
        "postalCode": "00100",
        "addressCountry": "KE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "-1.286389",
        "longitude": "36.815349"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+254745017979",
        "contactType": "customer service",
        "availableLanguage": ["English", "Swahili"]
      },
      "sameAs": [
        "https://instagram.com/axontechke",
        "https://facebook.com/axontechke",
        "https://tiktok.com/@axontechke"
      ]
    }
    </script>
    
    <!-- JSON-LD for WebSite (helps AI models understand the site structure) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AXON TECH Kenya",
      "url": "https://axontech.co.ke",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://axontech.co.ke/catalog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
